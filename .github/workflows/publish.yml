# Tests and publishes Dev Container Features to the GitHub Container Registry (GHCR)
# on every push to main.

name: Publish Dev Container Features

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    name: Test features
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install @devcontainers/cli
        run: npm install -g @devcontainers/cli

      - name: Test btp-cli-tools (scenarios)
        run: |
          devcontainer features test \
            --project-folder . \
            --skip-autogenerated \
            --features btp-cli-tools

      - name: Test cap-dev-stack (scenario)
        run: |
          devcontainer features test \
            --project-folder . \
            --skip-autogenerated \
            --features cap-dev-stack

      - name: Test fiori-dev-stack (scenario)
        run: |
          devcontainer features test \
            --project-folder . \
            --skip-autogenerated \
            --features fiori-dev-stack

      - name: Test npm-feeds (scenario)
        run: |
          devcontainer features test \
            --project-folder . \
            --skip-autogenerated \
            --features npm-feeds

      - name: Test dev-defaults (smoke test)
        run: |
          devcontainer features test \
            --project-folder . \
            --skip-autogenerated \
            --features dev-defaults

      - name: Test typescript (scenario)
        run: |
          devcontainer features test \
            --project-folder . \
            --skip-autogenerated \
            --features typescript

      - name: Test devcontainer-tools (scenario)
        run: |
          devcontainer features test \
            --project-folder . \
            --skip-autogenerated \
            --features devcontainer-tools

  publish:
    name: Publish to GHCR
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install @devcontainers/cli
        run: npm install -g @devcontainers/cli

      - name: Log in to GHCR
        run: printf '%s' "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Publish features
        run: |
          devcontainer features publish \
            --registry ghcr.io \
            --namespace "${GITHUB_REPOSITORY,,}" \
            ./src
