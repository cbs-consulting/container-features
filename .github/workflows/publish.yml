# Tests and publishes Dev Container Features to the GitHub Container Registry (GHCR)
# on every push to main.

name: Publish Dev Container Features

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Run shellcheck
        run: shellcheck lib/*.sh scripts/*.sh src/*/*.sh test/test.sh test/*/*.sh

      - name: Check shared library copies are in sync
        run: ./scripts/sync-lib.sh --check

  test:
    name: Test ${{ matrix.feature }}
    runs-on: ubuntu-latest
    # A failing entry marked allow-failure still shows red but doesn't block merge or publish.
    continue-on-error: ${{ matrix.allow-failure == true }}
    strategy:
      fail-fast: false
      matrix:
        feature:
          - btp-cli-tools
          - cap-dev-stack
          - dev-defaults
          - devcontainer-tools
          - fiori-dev-stack
          - npm-feeds
          - typescript
        include:
          # The upstream CF apt repository is signed with an expired key
          # (https://github.com/cloudfoundry/cli/issues/3863), which current Debian rejects.
          # Remove once upstream rotates the key.
          - feature: btp-cli-tools
            allow-failure: true
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install @devcontainers/cli
        run: npm install -g @devcontainers/cli

      - name: Test ${{ matrix.feature }} (scenarios)
        run: |
          devcontainer features test \
            --project-folder . \
            --skip-autogenerated \
            --features "${{ matrix.feature }}"

  # Branch protection requires a single "Test features" check; this job reports it for the whole matrix.
  test-summary:
    name: Test features
    needs: test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check matrix result
        run: test "${{ needs.test.result }}" = "success"

  publish:
    name: Publish to GHCR
    needs: [lint, test-summary]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install @devcontainers/cli
        run: npm install -g @devcontainers/cli

      - name: Log in to GHCR
        run: printf '%s' "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Publish features
        run: |
          devcontainer features publish \
            --registry ghcr.io \
            --namespace "${GITHUB_REPOSITORY,,}" \
            ./src
